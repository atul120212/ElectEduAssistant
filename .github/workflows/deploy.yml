name: Build and Deploy to Google Cloud Run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  BACKEND_SERVICE: election-edu-backend
  FRONTEND_SERVICE: election-edu-frontend

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
      GEMINI_API_KEY: dummy_key_for_testing
      JWT_SECRET: dummy_secret_for_testing
      JWT_REFRESH_SECRET: dummy_refresh_secret_for_testing
      NODE_ENV: test
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      
      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          npm install
          npx prisma generate
          npx prisma db push --accept-data-loss
      
      - name: Run backend tests
        working-directory: ./backend
        run: npm test
      
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install
      
      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test

  deploy-backend:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Enable Required GCP APIs
        run: |
          gcloud services enable secretmanager.googleapis.com \
                                 run.googleapis.com \
                                 sqladmin.googleapis.com \
                                 compute.googleapis.com \
                                 cloudresourcemanager.googleapis.com
      
      - name: Configure Docker for GCR
        run: gcloud auth configure-docker
      
      - name: Build backend image
        working-directory: ./backend
        run: |
          docker build -t gcr.io/$PROJECT_ID/$BACKEND_SERVICE:$GITHUB_SHA \
                       -t gcr.io/$PROJECT_ID/$BACKEND_SERVICE:latest .
      
      - name: Push backend image
        run: |
          docker push gcr.io/$PROJECT_ID/$BACKEND_SERVICE:$GITHUB_SHA
          docker push gcr.io/$PROJECT_ID/$BACKEND_SERVICE:latest
      
      - name: Push Secrets to GCP Secret Manager
        run: |
          echo -n "${{ secrets.GEMINI_API_KEY }}" | gcloud secrets versions add gemini-api-key --data-file=- || \
          (gcloud secrets create gemini-api-key --replication-policy="automatic" && \
           echo -n "${{ secrets.GEMINI_API_KEY }}" | gcloud secrets versions add gemini-api-key --data-file=-)
          
          # Only sync JWT_SECRET if it exists in GitHub, otherwise generate a random one if GCP secret is missing
          if [ ! -z "${{ secrets.JWT_SECRET }}" ]; then
            echo -n "${{ secrets.JWT_SECRET }}" | gcloud secrets versions add jwt-secret --data-file=- || true
          fi

      - name: Reset Service Configuration
        run: |
          gcloud run services update $BACKEND_SERVICE \
            --platform managed \
            --region $REGION \
            --clear-env-vars \
            --clear-secrets || true

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy $BACKEND_SERVICE \
            --image gcr.io/$PROJECT_ID/$BACKEND_SERVICE:$GITHUB_SHA \
            --platform managed \
            --region $REGION \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --max-instances 10 \
            --min-instances 1 \
            --timeout 300 \
            --set-env-vars "NODE_ENV=production,API_VERSION=v1,GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},DATABASE_URL=${{ secrets.DATABASE_URL }},JWT_SECRET=${{ secrets.JWT_SECRET || 'fallback-random-secret-123' }},CORS_ORIGIN=*" \
            ${{ secrets.CLOUD_SQL_CONNECTION && format('--add-cloudsql-instances {0}', secrets.CLOUD_SQL_CONNECTION) || '' }}

  deploy-frontend:
    needs: [test, deploy-backend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Get backend URL
        id: backend-url
        run: |
          URL=$(gcloud run services describe $BACKEND_SERVICE \
                --region $REGION \
                --format 'value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT
      
      - name: Build frontend image
        working-directory: ./frontend
        env:
          VITE_API_URL: ${{ steps.backend-url.outputs.url }}/api/v1
        run: |
          docker build -t gcr.io/$PROJECT_ID/$FRONTEND_SERVICE:$GITHUB_SHA \
                       -t gcr.io/$PROJECT_ID/$FRONTEND_SERVICE:latest \
                       --build-arg VITE_API_URL=$VITE_API_URL .
      
      - name: Push frontend image
        run: |
          docker push gcr.io/$PROJECT_ID/$FRONTEND_SERVICE:$GITHUB_SHA
          docker push gcr.io/$PROJECT_ID/$FRONTEND_SERVICE:latest
      
      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy $FRONTEND_SERVICE \
            --image gcr.io/$PROJECT_ID/$FRONTEND_SERVICE:$GITHUB_SHA \
            --platform managed \
            --region $REGION \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --max-instances 5

  notify:
    needs: [deploy-backend, deploy-frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send deployment notification
        run: echo "Deployment completed!"
